name = "theaetetus"
version = "0.2.0"
description = "The arithmetic of coupled resolutions: the defect of a positive-definite quadratic form on a lattice, and its failure to factor over the primes."
keywords = ["math", "number-theory", "lattices", "theta-functions"]
homepage = "https://github.com/typhdotcom/theaetetus"
license = "Apache-2.0"
defaultTargets = ["Theaetetus"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[require]]
name = "descent"
git = "https://git.typh.com/typh/descent.git"
rev = "e78ccb34d970f45f600162247b4a0147260fe5e4"

[[lean_lib]]
name = "Theaetetus"
